name: Windows binary release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-binary:
    runs-on: windows-latest

    name: windows (${{ matrix.r-version }})

    strategy:
      fail-fast: false
      matrix:
        r-version:
          - oldrel-1
          - release
          - devel

    env:
      ITKR_RELEASE_ASSET: ITKR-${{ matrix.r-version }}.zip

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}
          windows-path-include-rtools: true

      - name: Standardize R version
        shell: Rscript {0}
        run: |
          rver <- paste(R.version$major, strsplit(R.version$minor, ".", fixed = TRUE)[[1]][1], sep = ".")
          label <- "${{ matrix.r-version }}"
          # ANTsRCore-<setup-r version>.zip (e.g. ANTsRCore-release.zip) is the
          # stable name ANTsR CI fetches from releases/latest/download/
          writeLines(c(
            sprintf("PACKAGE_ASSET=ANTsRCore-%s-R%s.zip", label, rver),
            sprintf("PACKAGE_ALIAS=ANTsRCore-%s.zip", label),
            sprintf("PACKAGE_RVER=ANTsRCore-%s.zip", rver)
          ), Sys.getenv("GITHUB_ENV"))

      # build against the ITKR release binary, and drop Remotes so nothing
      # tries to rebuild ITKR from source
      - name: Install ITKR binary
        shell: Rscript {0}
        run: |
          install.packages("Rcpp", repos = "https://cloud.r-project.org")
          asset <- Sys.getenv("ITKR_RELEASE_ASSET")
          url <- sprintf("https://github.com/ANTsX/ITKR/releases/latest/download/%s", asset)
          dest <- file.path(tempdir(), asset)
          download.file(url, dest, mode = "wb", quiet = TRUE)
          install.packages(dest, repos = NULL, type = "win.binary")
          if (!requireNamespace("ITKR", quietly = TRUE)) stop("ITKR binary did not install")

          dcf <- read.dcf("DESCRIPTION")
          write.dcf(dcf[, colnames(dcf) != "Remotes", drop = FALSE], "DESCRIPTION")

      - name: Build Windows binary
        shell: cmd
        run: |
          R CMD INSTALL --build --no-multiarch .
          for /f "delims=" %%i in ('dir /b /s ANTsRCore_*.zip') do set ZIPFILE=%%i
          if not defined ZIPFILE (
            echo ANTsRCore binary zip was not produced.
            exit /b 1
          )
          copy /y "%ZIPFILE%" "%PACKAGE_ASSET%"
          copy /y "%ZIPFILE%" "%PACKAGE_ALIAS%"
          copy /y "%ZIPFILE%" "%PACKAGE_RVER%"

      - name: Smoke test
        shell: Rscript {0}
        run: |
          install.packages(Sys.getenv("PACKAGE_ALIAS"), repos = NULL, type = "win.binary")
          library(ANTsRCore)
          cat("ANTsRCore binary loads\n")

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_ASSET }}
          path: |
            ${{ env.PACKAGE_ASSET }}
            ${{ env.PACKAGE_ALIAS }}
            ${{ env.PACKAGE_RVER }}

  publish:
    needs: windows-binary
    # publish whatever built, so a devel failure doesn't block oldrel/release
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: ANTsRCore-*.zip
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          # downstream CI downloads from releases/latest/download/
          make_latest: true
          files: assets/*.zip
          fail_on_unmatched_files: true
          overwrite_files: true
