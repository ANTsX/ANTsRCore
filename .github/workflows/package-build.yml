# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# NOTE: This workflow is overkill for most R packages and
# check-standard.yaml is likely a better choice.
# usethis::use_github_action("check-standard") will install it.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

name: pkg-build

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false # don't stop all jobs if one platform build fails
      matrix:
        config:
          # ubuntu-latest is GCC 15 (needs ITKR >= 0.6.1); ubuntu-24.04 keeps
          # GCC 13 covered.
          - { os: ubuntu-latest, r: "release" }
          - { os: ubuntu-24.04, r: "release" }
          - { os: macos-latest, r: "release" }
          - { os: windows-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      ITKR_RELEASE_ASSET: ITKR-release.zip

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - name: Install ITKR binary
        if: runner.os == 'Windows'
        shell: Rscript {0}
        run: |
          asset <- Sys.getenv("ITKR_RELEASE_ASSET")
          url <- sprintf("https://github.com/ANTsX/ITKR/releases/latest/download/%s", asset)
          dest <- file.path(tempdir(), "ITKR_0.6.0.2.zip")
          unpack <- file.path(tempdir(), "ITKR")

          unlink(unpack, recursive = TRUE, force = TRUE)
          dir.create(unpack, recursive = TRUE, showWarnings = FALSE)

          download.file(url, dest, mode = "wb", quiet = TRUE)
          print(getOption("unzip"))
          unzip(dest, exdir = unpack)
          print("unpack")
          # print(list.files(unpack, recursive = TRUE))

          desc <- list.files(unpack, pattern = "^DESCRIPTION$", recursive = TRUE, full.names = TRUE)[1]
          if (is.na(desc) || !nzchar(desc)) {
            stop(sprintf("Could not find DESCRIPTION inside %s", asset))
          }
          print(paste0("desc", desc))
          
          get_description_deps <- function(path = "DESCRIPTION",
                                 fields = c("Depends", "Imports", "LinkingTo"),
                                 include_r = FALSE) {
            dcf <- read.dcf(path)
          
            deps <- tools:::.split_dependencies(dcf[1, fields[fields %in% colnames(dcf)]])
            pkgs <- names(deps)
          
            if (!include_r) {
              pkgs <- setdiff(pkgs, "R")
            }
          
            unique(pkgs)
          }
          install.packages(get_description_deps(desc))
          
          pkgdir <- dirname(desc)
          print(paste0("pkgdir is ", pkgdir))
          print(list.files(pkgdir))
          ver = read.dcf(desc, "Version")[,1]
          tdir = getwd()
          itkr_source = file.path(tdir, paste0("ITKR_", ver, ".zip"))
          print(paste0("itkr_source, ", itkr_source))
          setwd(dirname(pkgdir))
          zip(itkr_source, files = list.files("ITKR/", recursive = TRUE, full.names = TRUE))
          setwd(tdir)
          print(paste0("itkr_source, ", itkr_source))
          install.packages(itkr_source, repos = NULL, type = "win.binary")
          print("require")
          print(requireNamespace("ITKR", quietly = FALSE))

          if (!requireNamespace("ITKR", quietly = TRUE)) {
            stop("ITKR binary is not installed, refusing to edit DESCRIPTION")
          }

          desc <- "DESCRIPTION"
          lines <- readLines(desc, warn = FALSE)
          rem = grepl("^Remotes:\\s*", lines)
          itkr_source = normalizePath(itkr_source, winslash = "/")
          lines[rem] <- sub("ANTsX/ITKR", paste0("ITKR=local::", itkr_source), lines[rem])
          writeLines(lines, desc)

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          error-on: '"error"'

      # On a Windows build failure, keep the ANTs (antb) CMake build tree and
      # the linker/Makevars files. R CMD check builds in a temporary copy of
      # the package, so search for them instead of using fixed paths.
      - name: Collect antb build files on failure
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP 'antb-debug'
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          $roots = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, 'D:\a') |
            Where-Object { Test-Path $_ } | Sort-Object -Unique

          $files = @('Makevars.win', 'Makevars', 'linkwrap.cmd', 'g++.cmd',
                     'ANTS-cfgcmd.txt', 'tmp.def', '*-link-tmp.def',
                     '*-gpp-tmp.def', '00install.out')
          $found = foreach ($root in $roots) {
            Get-ChildItem -Path $root -Recurse -File -Include $files -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notlike "$staging*" }
          }
          foreach ($f in ($found | Sort-Object FullName -Unique)) {
            $name = ($f.FullName -replace '^[A-Za-z]:\\', '') -replace '[\\/:]', '_'
            Copy-Item -Path $f.FullName -Destination (Join-Path $staging $name) -Force
          }

          $antb = foreach ($root in $roots) {
            Get-ChildItem -Path $root -Recurse -File -Filter CMakeCache.txt -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\antb\\CMakeCache\.txt$' } |
              ForEach-Object { Split-Path $_.FullName -Parent }
          }
          $antb = $antb | Sort-Object -Unique
          if (-not $antb) { Write-Warning "No antb build directories found to collect." }
          foreach ($dir in $antb) {
            $suffix = [Guid]::NewGuid().ToString('N').Substring(0, 8)
            Copy-Item -Path $dir -Destination (Join-Path $staging "antb-$suffix") -Recurse -Force
          }

      - name: Upload antb build files
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: antb-build-files-windows
          path: ${{ runner.temp }}/antb-debug
          if-no-files-found: warn
