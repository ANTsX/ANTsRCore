name: Windows Rtools build

on:
  workflow_dispatch:
    inputs:
      debug_session:
        description: "Open an interactive tmate shell before the build"
        required: false
        default: false
        type: boolean
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  windows-rtools-build:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        r-version: [release]

    env:
      ITKR_RELEASE_ASSET: ITKR-${{ matrix.r-version }}.zip

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}

      - name: Install ITKR binary
        shell: Rscript {0}
        run: |
          asset <- Sys.getenv("ITKR_RELEASE_ASSET")
          url <- sprintf("https://github.com/muschellij2/ITKR/releases/latest/download/%s", asset)
          dest <- file.path(tempdir(), "ITKR_0.6.0.2.zip")
          unpack <- file.path(tempdir(), "ITKR")

          unlink(unpack, recursive = TRUE, force = TRUE)
          dir.create(unpack, recursive = TRUE, showWarnings = FALSE)

          download.file(url, dest, mode = "wb", quiet = TRUE)
          print(getOption("unzip"))
          unzip(dest, exdir = unpack)
          print("unpack")
          # print(list.files(unpack, recursive = TRUE))

          desc <- list.files(unpack, pattern = "^DESCRIPTION$", recursive = TRUE, full.names = TRUE)[1]
          if (is.na(desc) || !nzchar(desc)) {
            stop(sprintf("Could not find DESCRIPTION inside %s", asset))
          }
          print(paste0("desc", desc))
          
          get_description_deps <- function(path = "DESCRIPTION",
                                 fields = c("Depends", "Imports", "LinkingTo"),
                                 include_r = FALSE) {
            dcf <- read.dcf(path)
          
            deps <- tools:::.split_dependencies(dcf[1, fields[fields %in% colnames(dcf)]])
            pkgs <- names(deps)
          
            if (!include_r) {
              pkgs <- setdiff(pkgs, "R")
            }
          
            unique(pkgs)
          }
          install.packages(get_description_deps(desc))
          
          pkgdir <- dirname(desc)
          print(paste0("pkgdir is ", pkgdir))
          print(list.files(pkgdir))
          ver = read.dcf(desc, "Version")[,1]
          tdir = getwd()
          itkr_source = file.path(tdir, paste0("ITKR_", ver, ".zip"))
          print(paste0("itkr_source, ", itkr_source))
          setwd(dirname(pkgdir))
          zip(itkr_source, files = list.files("ITKR/", recursive = TRUE, full.names = TRUE))
          setwd(tdir)
          print(paste0("itkr_source, ", itkr_source))
          install.packages(itkr_source, repos = NULL, type = "win.binary")
          print("require")
          print(requireNamespace("ITKR", quietly = FALSE))

          if (!requireNamespace("ITKR", quietly = TRUE)) {
            stop("ITKR binary is not installed, refusing to edit DESCRIPTION")
          }

          desc <- "DESCRIPTION"
          lines <- readLines(desc, warn = FALSE)
          rem = grepl("^Remotes:\\s*", lines)
          itkr_source = normalizePath(itkr_source, winslash = "/")
          lines[rem] <- sub("ANTsX/ITKR", paste0("ITKR=local::", itkr_source), lines[rem])
          writeLines(lines, desc)

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Build ANTsRCore
        shell: cmd
        run: |
          R CMD INSTALL .

      - name: Collect antb build files on failure
        if: failure()
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP 'antb-debug'
          New-Item -ItemType Directory -Force -Path $staging | Out-Null

          $workspaceSnapshot = Join-Path $staging 'workspace'
          if (Test-Path $env:GITHUB_WORKSPACE) {
            Copy-Item -Path $env:GITHUB_WORKSPACE -Destination $workspaceSnapshot -Recurse -Force
          }

          $lockRoots = @(
            Join-Path $env:RUNNER_TEMP 'Library\00LOCK-ANTsRCore'
            'D:\a\_temp\Library\00LOCK-ANTsRCore'
          )
          foreach ($lockRoot in $lockRoots) {
            if (Test-Path $lockRoot) {
              $target = Join-Path $staging 'lock'
              Copy-Item -Path $lockRoot -Destination $target -Recurse -Force
            }
          }

          $roots = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, 'D:\a')
          $matches = @()
          foreach ($root in $roots) {
            if (Test-Path $root) {
              $matches += Get-ChildItem -Path $root -Recurse -File -Filter CMakeCache.txt -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match '\\antb\\CMakeCache\.txt$' } |
                ForEach-Object { Split-Path $_.FullName -Parent }
            }
          }
          $matches = $matches | Sort-Object -Unique

          $debugFiles = @(
            Join-Path $env:GITHUB_WORKSPACE 'src\Makevars.win'
            Join-Path $env:GITHUB_WORKSPACE 'src\Makevars'
            Join-Path $env:GITHUB_WORKSPACE 'src\antb\Makefile'
            Join-Path $env:GITHUB_WORKSPACE 'src\antb\ANTS-build\Makefile'
            Join-Path $env:GITHUB_WORKSPACE 'src\antb\ANTS-prefix\tmp\ANTS-cfgcmd.txt'
            Join-Path $env:GITHUB_WORKSPACE 'src\ANTsRCore-link-tmp.def'
            Join-Path $env:GITHUB_WORKSPACE 'src\ANTsRCore-gpp-tmp.def'
            Join-Path $env:RUNNER_TEMP 'ANTsRCore-link-tmp.def'
            Join-Path $env:RUNNER_TEMP 'ANTsRCore-gpp-tmp.def'
            Join-Path $env:GITHUB_WORKSPACE 'src\linkwrap.cmd'
            Join-Path $env:GITHUB_WORKSPACE 'src\g++.cmd'            
          )
          foreach ($file in $debugFiles) {
            if (Test-Path $file) {
              Copy-Item -Path $file -Destination $staging -Force
            }
          }

          $tmpDefs = @()
          foreach ($root in $roots) {
            if (Test-Path $root) {
              $tmpDefs += Get-ChildItem -Path $root -Recurse -File -Filter tmp.def -ErrorAction SilentlyContinue |
                ForEach-Object { $_.FullName }
            }
          }
          $tmpDefs = $tmpDefs | Sort-Object -Unique
          foreach ($file in $tmpDefs) {
            Copy-Item -Path $file -Destination $staging -Force
          }

          if (-not $matches) {
            Write-Warning "No antb build directories found to collect."
            exit 0
          }

          foreach ($dir in $matches) {
            $label = Split-Path $dir -Leaf
            $suffix = [Guid]::NewGuid().ToString('N').Substring(0, 8)
            $target = Join-Path $staging "$label-$suffix"
            Copy-Item -Path $dir -Destination $target -Recurse -Force
          }

      - name: Upload antb build files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: antb-build-files-windows
          path: ${{ runner.temp }}/antb-debug
          if-no-files-found: warn

      - name: Smoke test
        shell: Rscript {0}
        run: |
          library(ANTsRCore)
          cat("ANTsRCore loaded on Windows\n")
